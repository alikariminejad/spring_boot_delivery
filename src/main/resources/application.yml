#===========================================
# Server & Application Settings
#===========================================
server:
  port: 8080

spring:
  application:
    name: delivery-system

  #===========================================
  # Database & JPA Settings (PostgreSQL)
  #===========================================
  datasource:
    url: jdbc:postgresql://localhost:5432/delivery_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  #===========================================
  # Flyway Settings
  #===========================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  #===========================================
  # Actuator Settings
  #===========================================
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always